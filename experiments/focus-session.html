<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ee">
  <meta name="description" content="A simple offline focus timer with short breaks.">
  <title>Focus Session — Daily Works</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f3ee;
      --card: #fffefa;
      --ink: #191919;
      --muted: #686862;
      --line: #d9d7d0;
      --soft: #e9e6de;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 620px);
      margin: 0 auto;
      padding: 28px 20px 48px;
    }
    a { color: inherit; text-underline-offset: 4px; }
    .eyebrow {
      color: var(--muted);
      font-size: .72rem;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 18px 0 8px;
      font-size: clamp(2.2rem, 8vw, 3.6rem);
      line-height: 1;
      letter-spacing: -.065em;
    }
    .intro { max-width: 42ch; color: var(--muted); }
    .panel {
      margin-top: 28px;
      padding: clamp(20px, 6vw, 34px);
      border: 1px solid var(--line);
      background: var(--card);
    }
    .modes { display: flex; flex-wrap: wrap; gap: 8px; }
    button, select {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: transparent;
      color: var(--ink);
      font: inherit;
    }
    button { padding: 9px 14px; cursor: pointer; }
    button[aria-pressed="true"], .primary {
      border-color: var(--ink);
      background: var(--ink);
      color: var(--card);
    }
    button:disabled { cursor: default; opacity: .48; }
    button:focus-visible, select:focus-visible, a:focus-visible {
      outline: 3px solid #77776e;
      outline-offset: 3px;
    }
    .clock {
      margin: 30px 0 18px;
      font-size: clamp(4.2rem, 19vw, 7.2rem);
      font-weight: 600;
      line-height: 1;
      letter-spacing: -.075em;
      font-variant-numeric: tabular-nums;
    }
    .track {
      height: 5px;
      overflow: hidden;
      background: var(--soft);
    }
    .progress { width: 0; height: 100%; background: var(--ink); }
    .status { min-height: 3em; margin: 14px 0 20px; color: var(--muted); }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; }
    .settings {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }
    label { font-size: .9rem; color: var(--muted); }
    select { padding: 8px 10px; background: var(--card); }
    .count { margin: 22px 0 0; color: var(--muted); font-size: .9rem; }
    footer { margin-top: 24px; color: var(--muted); font-size: .85rem; }
    @media (max-width: 380px) {
      .settings { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Daily Works / Small utility</div>
    <h1>Focus, then reset.</h1>
    <p class="intro">Choose one task, work until the timer ends, then take a short break. This page runs locally in your browser and needs no account or connection.</p>

    <section class="panel" aria-label="Focus timer">
      <div class="modes" aria-label="Timer mode">
        <button id="focusMode" type="button" aria-pressed="true">Focus</button>
        <button id="breakMode" type="button" aria-pressed="false">Short break · 5 min</button>
      </div>

      <div class="clock" id="clock" role="timer" aria-label="25 minutes remaining">25:00</div>
      <div class="track" id="track" role="progressbar" aria-label="Session progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress" id="progress"></div>
      </div>
      <p class="status" id="status" aria-live="polite">Ready when you are. Pick one task and begin.</p>

      <div class="controls">
        <button class="primary" id="start" type="button">Start</button>
        <button id="pause" type="button" disabled>Pause</button>
        <button id="reset" type="button">Reset</button>
      </div>

      <div class="settings">
        <label for="focusLength">Focus session length</label>
        <select id="focusLength">
          <option value="15">15 minutes</option>
          <option value="25" selected>25 minutes</option>
          <option value="45">45 minutes</option>
          <option value="50">50 minutes</option>
        </select>
      </div>
      <p class="count">Focus sessions completed: <strong id="completed">0</strong></p>
    </section>

    <footer><a href="../index.html">← Daily Works</a></footer>
  </main>

  <script>
    const clock = document.querySelector("#clock");
    const statusText = document.querySelector("#status");
    const progress = document.querySelector("#progress");
    const track = document.querySelector("#track");
    const startButton = document.querySelector("#start");
    const pauseButton = document.querySelector("#pause");
    const resetButton = document.querySelector("#reset");
    const focusModeButton = document.querySelector("#focusMode");
    const breakModeButton = document.querySelector("#breakMode");
    const focusLength = document.querySelector("#focusLength");
    const completedText = document.querySelector("#completed");

    let mode = "focus";
    let remaining = durationForMode();
    let deadline = 0;
    let intervalId = null;
    let running = false;
    let completed = 0;
    let message = "";

    function durationForMode() {
      return mode === "focus" ? Number(focusLength.value) * 60 : 5 * 60;
    }

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      const rest = seconds % 60;
      return String(minutes).padStart(2, "0") + ":" + String(rest).padStart(2, "0");
    }

    function render() {
      const total = durationForMode();
      const percent = Math.round((1 - remaining / total) * 100);
      clock.textContent = formatTime(remaining);
      clock.setAttribute("aria-label", formatTime(remaining) + " remaining");
      progress.style.width = Math.max(0, Math.min(100, percent)) + "%";
      track.setAttribute("aria-valuenow", String(Math.max(0, Math.min(100, percent))));
      completedText.textContent = String(completed);
      focusModeButton.setAttribute("aria-pressed", String(mode === "focus"));
      breakModeButton.setAttribute("aria-pressed", String(mode === "break"));
      focusLength.disabled = mode !== "focus";
      startButton.disabled = running;
      pauseButton.disabled = !running;
      startButton.textContent = remaining === 0 ? "Start again" : "Start";
      document.title = formatTime(remaining) + " · " + (mode === "focus" ? "Focus" : "Break");
      statusText.textContent = message || (running
        ? "Stay with one task until the timer ends."
        : "Ready when you are. Pick one task and begin.");
    }

    function stopInterval() {
      if (intervalId !== null) window.clearInterval(intervalId);
      intervalId = null;
    }

    function resetTimer() {
      stopInterval();
      running = false;
      deadline = 0;
      remaining = durationForMode();
      message = "";
      render();
    }

    function tick() {
      remaining = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
      if (remaining === 0) {
        stopInterval();
        running = false;
        deadline = 0;
        if (mode === "focus") {
          completed += 1;
          message = "Focus complete. Take a short break, or start another session.";
        } else {
          message = "Break complete. Ready to focus again?";
        }
      }
      render();
    }

    startButton.addEventListener("click", () => {
      if (running) return;
      if (remaining === 0) remaining = durationForMode();
      message = "";
      running = true;
      deadline = Date.now() + remaining * 1000;
      intervalId = window.setInterval(tick, 250);
      render();
    });

    pauseButton.addEventListener("click", () => {
      if (!running) return;
      remaining = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
      stopInterval();
      running = false;
      deadline = 0;
      message = "Paused. Resume when you're ready.";
      render();
    });

    resetButton.addEventListener("click", resetTimer);
    focusModeButton.addEventListener("click", () => {
      mode = "focus";
      resetTimer();
    });
    breakModeButton.addEventListener("click", () => {
      mode = "break";
      resetTimer();
    });
    focusLength.addEventListener("change", resetTimer);

    render();
  </script>
</body>
</html>
